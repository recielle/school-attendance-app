<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student QR & GPS Monitoring</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://cloudflare.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4">

<script>
  const SUPABASE_URL = 'https://ljtufyignjptcuammnlx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Sb3Ilw6MjemVcJgcDI1TJA_ZVIGuKl-';
  const SCHOOL_LAT = 14.5869;
  const SCHOOL_LNG = 121.1753;

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUserProfile = null;
  let qrTimerInterval = null;
</script>

<div id="auth-view" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow mt-8">
  <h1 class="text-2xl font-bold text-center mb-4">School QR & GPS Monitoring</h1>
  <div class="flex gap-2 mb-4">
    <button onclick="toggleAuthMode('login')" id="tab-login" class="flex-1 py-2 bg-blue-600 text-white rounded font-semibold">Login</button>
    <button onclick="toggleAuthMode('signup')" id="tab-signup" class="flex-1 py-2 bg-slate-200 rounded font-semibold">Sign Up</button>
  </div>

  <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
    <div id="signup-fields" class="hidden space-y-3">
      <select id="role" onchange="updateRoleFields()" class="w-full border p-2 rounded">
        <option value="student">Student</option>
        <option value="parent">Parent (1-to-1 Child Link)</option>
        <option value="teacher">Teacher (Class Monitoring Only)</option>
      </select>
      <div class="flex gap-2">
        <input id="first_name" placeholder="First Name (e.g. Juan)" class="w-1/2 border p-2 rounded" />
        <input id="last_name" placeholder="Last Name (e.g. Luna)" class="w-1/2 border p-2 rounded" />
      </div>
      <input id="student_number" placeholder="Student Number (e.g. 2026-0001)" class="w-full border p-2 rounded" />
    </div>

    <input id="email" type="email" required placeholder="Email (e.g. juanluna@email.com)" class="w-full border p-2 rounded" />
    <input id="password" type="password" required placeholder="Password (min 6 chars)" class="w-full border p-2 rounded" />
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Continue</button>
  </form>
  <p id="auth-msg" class="text-red-600 text-sm mt-2 text-center"></p>
</div>

<div id="dashboard-view" class="hidden max-w-3xl mx-auto space-y-6">
  <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
    <div>
      <h2 id="welcome-title" class="text-xl font-bold"></h2>
      <p id="role-badge" class="text-sm text-slate-500 uppercase"></p>
    </div>
    <button onclick="logout()" class="bg-red-500 text-white px-4 py-1.5 rounded text-sm font-semibold">Logout</button>
  </div>

  <div id="student-panel" class="hidden space-y-4">
    <div class="bg-white p-6 rounded-xl shadow text-center">
      <h3 class="font-bold text-lg mb-1">My Dynamic Gate QR Code</h3>
      <p class="text-xs text-slate-500 mb-3">Auto-refreshes every 3 minutes to prevent screenshot sharing</p>
      <div id="qrcode" class="flex justify-center my-4"></div>
      <p id="qr-countdown" class="font-mono font-bold text-blue-600">Expires in 3:00</p>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <h3 class="font-bold text-lg mb-2">Live GPS & School ETA</h3>
      <button onclick="shareStudentGPS()" class="bg-emerald-600 text-white px-4 py-2 rounded font-semibold text-sm">Share / Update Live Location</button>
      <p id="student-gps-info" class="mt-3 text-sm text-slate-700">GPS not shared yet.</p>
    </div>
  </div>

  <div id="parent-panel" class="hidden bg-white p-6 rounded-xl shadow">
    <h3 class="font-bold text-lg mb-2">Child's Live GPS & ETA</h3>
    <div id="parent-child-gps" class="text-sm text-slate-700">Loading child location...</div>
  </div>

  <div class="bg-white p-6 rounded-xl shadow">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-lg">Class Attendance Monitoring</h3>
      <button onclick="loadLogs()" class="text-sm text-blue-600 underline">Refresh</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b bg-slate-50">
            <th class="p-2">Student Name</th>
            <th class="p-2">Student No.</th>
            <th class="p-2">Time</th>
            <th class="p-2">Status</th>
          </tr>
        </thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let isSignup = false;

  function toggleAuthMode(mode) {
    isSignup = mode === 'signup';
    document.getElementById('signup-fields').classList.toggle('hidden', !isSignup);
    document.getElementById('tab-login').className = isSignup ? 'flex-1 py-2 bg-slate-200 rounded font-semibold' : 'flex-1 py-2 bg-blue-600 text-white rounded font-semibold';
    document.getElementById('tab-signup').className = isSignup ? 'flex-1 py-2 bg-blue-600 text-white rounded font-semibold' : 'flex-1 py-2 bg-slate-200 rounded font-semibold';
  }

  function updateRoleFields() {
    const role = document.getElementById('role').value;
    const snInput = document.getElementById('student_number');
    snInput.classList.toggle('hidden', role === 'teacher');
    snInput.placeholder = role === 'parent' ? "Child's Student Number (e.g. 2026-0001)" : "Your Student Number (e.g. 2026-0001)";
  }

  async function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('auth-msg');
    msg.textContent = 'Processing...';

    if (isSignup) {
      const role = document.getElementById('role').value;
      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const sn = document.getElementById('student_number').value.trim();

      const { data, error } = await db.auth.signUp({ email, password });
      if (error) { msg.textContent = error.message; return; }

      const profileData = {
        id: data.user.id,
        email,
        role,
        first_name,
        last_name,
        student_number: role === 'student' ? sn : null,
        linked_student_number: role === 'parent' ? sn : null
      };

      const { error: profErr } = await db.from('profiles').insert([profileData]);
      if (profErr) { msg.textContent = 'Student number is already linked to a parent or already exists.'; return; }
      loadDashboard(data.user.id);
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) { msg.textContent = error.message; return; }
      loadDashboard(data.user.id);
    }
  }

  async function loadDashboard(userId) {
    const { data: profile } = await db.from('profiles').select('*').eq('id', userId).single();
    if (!profile) return;
    currentUserProfile = profile;

    document.getElementById('auth-view').classList.add('hidden');
    document.getElementById('dashboard-view').classList.remove('hidden');
    document.getElementById('welcome-title').textContent = `${profile.first_name} ${profile.last_name}`;
    document.getElementById('role-badge').textContent = `${profile.role} Account`;

    document.getElementById('student-panel').classList.toggle('hidden', profile.role !== 'student');
    document.getElementById('parent-panel').classList.toggle('hidden', profile.role !== 'parent');

    if (profile.role === 'student') startExpiringQR(profile.student_number);
    if (profile.role === 'parent') loadChildGPS(profile.linked_student_number);
    loadLogs();
  }

  function startExpiringQR(studentNumber) {
    function generate() {
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      const timestamp = Math.floor(Date.now() / 1000);
      const token = `${studentNumber}.${timestamp}`;
      new QRCode(container, { text: token, width: 200, height: 200 });
    }
    generate();
    let secondsLeft = 180;
    clearInterval(qrTimerInterval);
    qrTimerInterval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        generate();
        secondsLeft = 180;
      }
      const mins = Math.floor(secondsLeft / 60);
      const secs = String(secondsLeft % 60).padStart(2, '0');
      document.getElementById('qr-countdown').textContent = `Expires in ${mins}:${secs}`;
    }, 1000);
  }

  function calculateDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
